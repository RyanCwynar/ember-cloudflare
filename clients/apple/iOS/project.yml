# The iPhone app. Generate the Xcode project with `xcodegen` in this folder (scripts/build-ios.sh does).
# It compiles ../Sources/Shared, the code the Mac app shares, with its own screens in Sources.
name: EmberPhone
options:
  bundleIdPrefix: dev.byldr.ember
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ember:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Sources/Shared
      - path: ../Sources/Resources/ember-logo.png
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.byldr.ember.phone
        PRODUCT_NAME: Ember
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ember
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ember uses the microphone for huddles.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ember attaches the photos and videos you pick to messages.
        INFOPLIST_KEY_NSCameraUsageDescription: Ember attaches the photos and videos you take to messages.
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
